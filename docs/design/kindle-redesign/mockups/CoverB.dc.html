<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Capa B · Número do dia</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,800;9..144,900&amp;family=Inter:wght@400;500;600;700&amp;family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#111}a:hover{color:#3a3a3a}
</style>
</helmet>
<div style="width: 600px; height: 800px; box-sizing: border-box; display: flex; flex-direction: column; background: #ffffff; color: #111111; font-family: Inter, sans-serif">

  <div style="background: #111111; color: #ffffff; height: {{topH}}; box-sizing: border-box; padding: 26px 36px 22px; display: flex; flex-direction: column">
    <div style="display: flex; flex-direction: column; gap: 6px; font-size: 12px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase">
      <span style="color: #bdbdbd">Destaques de hoje</span>
      <div style="display: flex; flex-wrap: wrap; column-gap: 10px; row-gap: 4px; font-size: 14px; font-weight: 700; letter-spacing: 0.06em">
        <span>Ônibus sem motorista</span><span style="color: #8a8a8a">·</span>
        <span>Gêiseres em Saturno</span><span style="color: #8a8a8a">·</span>
        <span>Café direto ao Japão</span>
      </div>
    </div>
    <div style="flex-grow: 1; display: flex; align-items: flex-end; justify-content: space-between; gap: 16px">
      <span style="font-family: Fraunces, Georgia, serif; font-weight: 900; font-size: 220px; line-height: 0.78; letter-spacing: -0.05em">08</span>
      <div style="display: flex; flex-direction: column; align-items: flex-end; gap: 6px; padding-bottom: 6px; text-align: right">
        <span style="font-size: 30px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase">Nov</span>
        <span style="font-size: 16px; font-weight: 500; color: #bdbdbd">2026</span>
        <span style="font-size: 16px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; border-top: 1px solid #6b6b6b; padding-top: 8px; margin-top: 4px">Domingo</span>
      </div>
    </div>
  </div>

  <div style="flex-grow: 1; box-sizing: border-box; padding: 26px 36px 28px; display: flex; flex-direction: column; gap: 14px">
    <span style="font-size: 12px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: #595959">Manchete · Tecnologia</span>
    <h2 style="margin: 0; font-family: Fraunces, Georgia, serif; font-weight: 600; font-size: 40px; line-height: 1.06; letter-spacing: -0.02em">Cidade testa ônibus elétricos sem motorista em linha noturna</h2>

    <div style="flex-grow: 1"></div>

    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); column-gap: 20px; border-top: 3px solid #111111; padding-top: 12px">
      <sc-for list="{{desks}}" as="d" hint-placeholder-count="3">
        <div style="display: flex; flex-direction: column; gap: 6px">
          <div style="display: flex; align-items: baseline; gap: 8px">
            <span style="font-family: Fraunces, Georgia, serif; font-size: 22px; font-weight: 800">{{d.count}}</span>
            <span style="font-size: 13px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase">{{d.name}}</span>
          </div>
          <span style="font-family: 'Source Serif 4', Georgia, serif; font-size: 15px; line-height: 1.3; color: #3a3a3a">{{d.lead}}</span>
        </div>
      </sc-for>
    </div>

    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); align-items: center; font-size: 12px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: #595959; border-top: 1px solid #cfcfcf; padding-top: 10px">
      <span>7 matérias · 21 min</span>
      <span style="font-family: Fraunces, Georgia, serif; font-size: 22px; font-weight: 800; letter-spacing: -0.01em; text-transform: none; color: #111111; text-align: center">BiteSIze</span>
      <span style="text-align: right">Edição 312</span>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"numeralBlock":{"editor":"enum","default":"metade","options":["metade","terço"]},"$preview":{"width":600,"height":800}}'>
class Component extends DCLogic {
  renderVals() {
    const half = (this.props.numeralBlock ?? 'metade') === 'metade';
    return {
      topH: half ? '330px' : '270px',
      desks: [
        { name: 'Tecnologia', count: '3', lead: 'Bateria de sódio carrega em dez minutos' },
        { name: 'Ciência', count: '2', lead: 'Gêiseres de gelo em lua de Saturno' },
        { name: 'Economia', count: '2', lead: 'Feiras aceitam pagamento por aproximação' }
      ]
    };
  }
}
</script>
</body>
</html>

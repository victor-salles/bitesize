name: PR title

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  conventional:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Squash merges turn the PR title into the commit on main.
          types: |
            feat
            fix
            refactor
            perf
            test
            docs
            build
            ci
            chore
            revert
          subjectPattern: ^(?![A-Z]).+[^.]$
          subjectPatternError: |
            The description "{subject}" must start lowercase and not end with a period.

{% extends "base.html" %}
{% block title %}Sign up · BiteSIze{% endblock %}
{% block content %}
<h1>Sign up</h1>
<form method="post" action="{% url 'signup' %}" novalidate>
  {% csrf_token %}
  {{ form }}
  <button type="submit">Create account</button>
</form>
<p>Already have an account? <a href="{% url 'login' %}">Log in</a></p>
{% endblock %}

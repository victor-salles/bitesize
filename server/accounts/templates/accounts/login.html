{% extends "base.html" %}
{% block title %}Log in · BiteSIze{% endblock %}
{% block content %}
<h1>Log in</h1>
<form method="post" action="{% url 'login' %}" novalidate>
  {% csrf_token %}
  {{ form }}
  <button type="submit">Log in</button>
</form>
<p>Forgot your PIN? Contact Victor to reset it.</p>
<p>New here? Sign-up needs an invite link from Victor.</p>
{% endblock %}

{% extends "base.html" %}
{% block title %}Account · BiteSIze{% endblock %}
{% block content %}
<h1>Account</h1>
<p>Logged in as <strong>{{ user.username }}</strong>.</p>
<p>Forgot your PIN or need a new one? Contact Victor to reset it.</p>
{% if user.is_staff %}
<h2>Staff</h2>
<p><a href="{% url 'invites' %}">Invites</a></p>
{% endif %}
<form method="post" action="{% url 'logout' %}">
  {% csrf_token %}
  <button type="submit">Log out</button>
</form>
{% endblock %}

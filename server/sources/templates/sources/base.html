{# Temporary app-local base until the shared base.html (#57) and design (#59) land. #}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}BiteSIze{% endblock %}</title>
</head>
<body>
  {% if messages %}
  <ul class="messages">
    {% for message in messages %}<li class="{{ message.tags }}">{{ message }}</li>{% endfor %}
  </ul>
  {% endif %}
  <main>{% block content %}{% endblock %}</main>
</body>
</html>
